name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install pillow cryptography pywinauto
      - name: Unit tests (updates, change detection, game detection, start builder, publish gate)
        run: python -m unittest discover -s tests -v
      - name: Leak scan (no game files, no personal data, size limits)
        run: python tools/leak_scan.py
