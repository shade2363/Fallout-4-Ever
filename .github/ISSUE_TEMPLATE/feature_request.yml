name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please check docs/ROADMAP.md and docs/SCRIPTS.md first. Much of the unreleased project is waiting for verification, not for ideas. Do not attach game files.
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter / what problem does it solve?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you already tried or considered?
